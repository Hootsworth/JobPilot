name: Multi-Provider LLM Eval

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  provider-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build:packages

      - name: Run golden matching eval across OpenAI, Gemini & Meta Llama API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          META_BASE_URL: ${{ vars.META_BASE_URL || 'https://api.llama.com/compat/v1/' }}
          EVAL_OPENAI_MODEL: ${{ vars.EVAL_OPENAI_MODEL || '' }}
          EVAL_GEMINI_MODEL: ${{ vars.EVAL_GEMINI_MODEL || '' }}
          EVAL_META_MODEL: ${{ vars.EVAL_META_MODEL || '' }}
        run: npm run eval:providers --workspace=@jobpilot/evals
