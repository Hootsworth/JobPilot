<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Backend Engineering Intern - CRED - Internshala</title>
  </head>
  <body>
    <main>
      <div class="individual_internship_header">
        <div class="profile"><span class="heading_4_5">Backend Engineering Intern</span></div>
        <div class="company_name"><a class="link_display_like_text">CRED</a></div>
        <div id="location_names"><a href="#">Bengaluru</a></div>
        <div class="stipend">Rs 45,000 /month</div>
      </div>
      <div class="internship_details">
        <div class="text-container">Work on distributed fintech APIs in TypeScript & PostgreSQL.</div>
      </div>

      <form id="internshala-apply-form">
        <div class="form-group">
          <label for="cover_letter">Why should you be hired for this role?</label>
          <textarea id="cover_letter"></textarea>
        </div>
        <div class="form-group">
          <label for="is_github">GitHub Profile Link</label>
          <input id="is_github" type="url" />
        </div>
        <div class="form-group">
          <label for="is_portfolio">Portfolio / Personal Website</label>
          <input id="is_portfolio" type="url" value="https://my-custom-portfolio.dev" />
        </div>
        <div class="form-group">
          <label for="is_cgpa">College CGPA</label>
          <input id="is_cgpa" type="text" />
        </div>
        <div class="form-group">
          <label for="is_college">College / University</label>
          <input id="is_college" type="text" />
        </div>
        <button id="submit" type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
