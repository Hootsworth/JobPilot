<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Software Engineer - Zerodha | LinkedIn</title>
  </head>
  <body>
    <main>
      <div class="job-details-jobs-unified-top-card__job-title">
        <h1>Software Engineer (Backend Systems)</h1>
      </div>
      <div class="job-details-jobs-unified-top-card__company-name">
        <a href="#">Zerodha</a>
      </div>
      <div class="job-details-jobs-unified-top-card__primary-description-container">
        <span class="tvm__text">Bengaluru, Karnataka, India</span>
      </div>
      <div class="jobs-description__content">High-scale Go, Node.js, and PostgreSQL broking systems.</div>

      <form class="jobs-easy-apply-modal">
        <div class="field">
          <label for="li_email">Email address *</label>
          <input id="li_email" type="email" value="diya.locked@linkedin.user" required />
        </div>
        <div class="field">
          <label for="li_phone">Mobile phone number *</label>
          <input id="li_phone" type="tel" required />
        </div>
        <div class="field">
          <label for="li_yoe">How many years of work experience do you have?</label>
          <input id="li_yoe" type="number" />
        </div>
        <div class="field">
          <label for="li_notice">What is your notice period (days)?</label>
          <input id="li_notice" type="number" />
        </div>
        <fieldset>
          <legend>Will you now or in the future require sponsorship for employment visa status?</legend>
          <label><input type="radio" name="li_sponsor" value="Yes" /> Yes</label>
          <label><input type="radio" name="li_sponsor" value="No" /> No</label>
        </fieldset>
        <div class="field">
          <label for="li_resume">Upload Resume (PDF) *</label>
          <input id="li_resume" type="file" style="display:none" />
        </div>
        <button type="submit" aria-label="Submit application">Submit application</button>
      </form>
    </main>
  </body>
</html>
