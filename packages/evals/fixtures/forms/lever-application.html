<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BrowserStack - Product Engineer (Full Stack)</title>
  </head>
  <body>
    <main>
      <div class="posting-headline">
        <h2>Product Engineer (Full Stack)</h2>
      </div>
      <div class="posting-categories">
        <div class="location">Mumbai, India</div>
      </div>
      <div class="posting-requirements">Work on cloud device farms in Node.js and React.</div>
      <form id="lever-form">
        <div class="application-question">
          <label for="lv_name">Full name *</label>
          <input id="lv_name" name="name" type="text" required />
        </div>
        <div class="application-question">
          <label for="lv_email">Email *</label>
          <input id="lv_email" name="email" type="email" required />
        </div>
        <div class="application-question">
          <label for="lv_phone">Phone</label>
          <input id="lv_phone" name="phone" type="tel" value="+91-9999900000" />
        </div>
        <div class="application-question">
          <label for="lv_org">Current company</label>
          <input id="lv_org" name="org" type="text" />
        </div>
        <div class="application-question">
          <label for="lv_loc">Current location</label>
          <input id="lv_loc" name="location" type="text" />
        </div>
        <div class="application-question">
          <label for="lv_li">LinkedIn URL</label>
          <input id="lv_li" name="urls[LinkedIn]" type="url" />
        </div>
        <div class="application-question">
          <label for="lv_gh">GitHub URL</label>
          <input id="lv_gh" name="urls[GitHub]" type="url" />
        </div>
        <div class="application-question">
          <label for="lv_port">Portfolio website</label>
          <input id="lv_port" name="urls[Portfolio]" type="url" />
        </div>
        <div class="application-question">
          <label for="lv_resume">Resume/CV *</label>
          <input id="lv_resume" name="resume" type="file" />
        </div>
        <div class="application-question">
          <label for="lv_10th">10th Percentage</label>
          <input id="lv_10th" name="cards[0][field0]" type="number" />
        </div>
        <div class="application-question">
          <label for="lv_12th">12th Percentage</label>
          <input id="lv_12th" name="cards[0][field1]" type="number" />
        </div>
        <div class="application-question">
          <label for="lv_grad">Graduation Year</label>
          <select id="lv_grad" name="cards[0][field2]">
            <option value="">Choose one</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
          </select>
        </div>
        <div class="application-question">
          <label for="lv_comments">Additional information / cover letter</label>
          <textarea id="lv_comments" name="comments"></textarea>
        </div>
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
