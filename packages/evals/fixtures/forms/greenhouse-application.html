<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Software Engineer 1 (Backend) - Razorpay</title>
  </head>
  <body>
    <div id="main">
      <div class="header">
        <h1 class="app-title">Software Engineer 1 (Backend)</h1>
        <span class="company-name">at Razorpay</span>
        <div class="location">Bengaluru, India</div>
      </div>
      <div id="content">Build Node.js, TypeScript, and PostgreSQL payments infrastructure.</div>
      <form id="application_form">
        <div class="field">
          <label for="first_name">First Name *</label>
          <input id="first_name" name="job_application[first_name]" type="text" required />
        </div>
        <div class="field">
          <label for="last_name">Last Name *</label>
          <input id="last_name" name="job_application[last_name]" type="text" required />
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input id="email" name="job_application[email]" type="email" value="user.override@iitd.ac.in" required />
        </div>
        <div class="field">
          <label for="phone">Phone *</label>
          <input id="phone" name="job_application[phone]" type="tel" required />
        </div>
        <div class="field">
          <label for="resume">Resume/CV *</label>
          <input id="resume" name="job_application[resume]" type="file" style="display:none" />
        </div>
        <div class="field">
          <label for="gh_hub">Preferred City</label>
          <div id="gh_hub" role="combobox" class="select__control" aria-label="Preferred City">
            <input type="text" aria-label="Preferred City" />
            <div role="listbox">
              <div class="select__option" role="option" data-option-value="Bengaluru">Bengaluru, India</div>
              <div class="select__option" role="option" data-option-value="Mumbai">Mumbai, India</div>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="gh_ectc">Expected CTC (LPA) *</label>
          <input id="gh_ectc" type="number" required />
        </div>
        <div class="field">
          <label for="gh_notice">Notice period (days)</label>
          <input id="gh_notice" type="number" />
        </div>
        <div class="field">
          <label for="gh_cgpa">Current CGPA</label>
          <input id="gh_cgpa" type="text" />
        </div>
        <div class="field">
          <label for="gh_reloc">Willing to relocate to Bengaluru?</label>
          <select id="gh_reloc">
            <option value="">-- Select --</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <fieldset>
          <legend>Will you require visa sponsorship now or in the future?</legend>
          <label><input type="radio" name="gh_sponsor" value="Yes" /> Yes</label>
          <label><input type="radio" name="gh_sponsor" value="No" /> No</label>
        </fieldset>
        <div class="field">
          <label for="gh_why">Describe a high-impact backend bug or scaling project you led</label>
          <textarea id="gh_why"></textarea>
        </div>
        <button id="submit_app" type="submit">Submit Application</button>
      </form>
    </div>
  </body>
</html>
