<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Atlassian Careers | Software Engineer (Backend)</title>
  </head>
  <body>
    <main>
      <h2 data-automation-id="jobPostingHeader">Software Engineer (Backend)</h2>
      <div data-automation-id="locations"><dd>Bengaluru, India</dd></div>
      <div data-automation-id="jobPostingDescription">
        Design distributed cloud services on JVM/TypeScript and PostgreSQL.
      </div>
      <form id="workday-form">
        <div data-automation-id="formField-firstName">
          <label for="wd_fn">Legal First Name *</label>
          <input id="wd_fn" data-automation-id="legalNameSection_firstName" type="text" required />
        </div>
        <div data-automation-id="formField-lastName">
          <label for="wd_ln">Legal Last Name *</label>
          <input id="wd_ln" data-automation-id="legalNameSection_lastName" type="text" required />
        </div>
        <div data-automation-id="formField-email">
          <label for="wd_email">Email Address *</label>
          <input id="wd_email" data-automation-id="email" type="email" value="candidate.override@workday.test" required />
        </div>
        <div data-automation-id="formField-phone">
          <label for="wd_phone">Phone Number *</label>
          <input id="wd_phone" data-automation-id="phone-number" type="tel" required />
        </div>
        <div data-automation-id="formField-city">
          <label for="wd_city">City</label>
          <input id="wd_city" data-automation-id="addressSection_city" type="text" />
        </div>
        <div data-automation-id="formField-school">
          <label for="wd_school">School or University</label>
          <input id="wd_school" data-automation-id="school" type="text" />
        </div>
        <div data-automation-id="formField-degree">
          <label for="wd_degree">Degree</label>
          <select id="wd_degree" data-automation-id="degree">
            <option value="">Select One</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
          </select>
        </div>
        <div data-automation-id="formField-major">
          <label for="wd_major">Field of Study</label>
          <input id="wd_major" data-automation-id="fieldOfStudy" type="text" />
        </div>
        <div data-automation-id="formField-gpa">
          <label for="wd_gpa">Overall Result (GPA)</label>
          <input id="wd_gpa" data-automation-id="gpa" type="text" />
        </div>
        <div data-automation-id="formField-resume">
          <label for="wd_resume">Attach Resume *</label>
          <input id="wd_resume" data-automation-id="file-upload-input-ref" type="file" style="display:none" />
        </div>
        <button data-automation-id="bottom-navigation-next-button" type="submit">Submit Application</button>
      </form>
    </main>
  </body>
</html>
