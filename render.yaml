services:
  - type: web
    name: jobpilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: API_HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: gemini
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
