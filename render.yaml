services:
  - type: web
    name: jobpilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: API_HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: gemini
      - key: BILLING_MODE
        value: managed
      - key: MANAGED_FAST_PROVIDER
        value: gemini
      - key: MANAGED_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: MANAGED_PRECISION_PROVIDER
        value: gemini
      - key: MANAGED_PRECISION_MODEL
        value: gemini-3.8-flash
      - key: AUTO_SYNC_INTERVAL_HOURS
        value: 3
      - key: JOB_SYNC_STALE_HOURS
        value: 3
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
